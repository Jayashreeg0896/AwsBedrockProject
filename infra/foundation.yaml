AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda execution role

Parameters:
  ProjectTag:
    Type: String
  OwnerTag:
    Type: String
  EnvTag:
    Type: String

Resources:

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bedrock-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: Environment
          Value: !Ref EnvTag

  LambdaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: bedrock-lambda-policy
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream   # policy assistant: streaming Converse calls
              - bedrock:Rerank                          # policy assistant: Cohere Rerank 3.5
              - bedrock:ApplyGuardrail                  # policy assistant: Bedrock Guardrails (optional)
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - aws-marketplace:ViewSubscriptions
              - aws-marketplace:Subscribe
              - aws-marketplace:Unsubscribe
            Resource: "*"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !Sub "arn:aws:s3:::bedrock-rag-documents-${AWS::AccountId}"
              - !Sub "arn:aws:s3:::bedrock-rag-documents-${AWS::AccountId}/*"
          - Effect: Allow
            Action:
              - s3vectors:CreateIndex
              - s3vectors:DeleteIndex
              - s3vectors:GetIndex
              - s3vectors:ListIndexes
              - s3vectors:PutVectors
              - s3vectors:QueryVectors
              - s3vectors:DeleteVectors
              - s3vectors:GetVectors
              - s3vectors:ListVectors                   # semantic cache: expiry cleanup
            Resource: "*"
          - Effect: Allow
            Action:
              - textract:StartDocumentTextDetection
              - textract:GetDocumentTextDetection
            Resource: "*"
          # Policy assistant chat history (table created in app.yaml; its name contains "PolicyHistoryTable")
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:PutItem
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*PolicyHistoryTable*"

Outputs:
  LambdaRoleArn:
    Value: !GetAtt LambdaRole.Arn
