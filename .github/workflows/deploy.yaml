name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          REGISTRY=$(echo "${{ secrets.ECR_REPO_URI }}" | cut -d'/' -f1)
          PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "$PASSWORD" | docker login --username AWS --password-stdin $REGISTRY

      - name: Build image
        run: docker build -t chatbot ./lambda

      - name: Tag image
        run: docker tag chatbot:latest ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}

      - name: Push image
        run: docker push ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}

      - name: Debug Parameters
        run: |
          echo "STACK_NAME=${{ secrets.STACK_NAME }}"
          echo "ECR_REPO_URI=${{ secrets.ECR_REPO_URI }}"
          echo "LAMBDA_ROLE_ARN=${{ secrets.LAMBDA_ROLE_ARN }}"
          echo "PROJECT=${{ secrets.PROJECT }}"
          echo "OWNER=${{ secrets.OWNER }}"
          echo "ENV=${{ secrets.ENV }}"
          
      - name: Deploy
        run: |
          aws cloudformation deploy --stack-name "${{ secrets.STACK_NAME }}" --template-file infra/app.yaml --capabilities CAPABILITY_NAMED_IAM --parameter-overrides ImageUri=${{ secrets.ECR_REPO_URI }}:${{ github.sha }} LambdaRoleArn=${{ secrets.LAMBDA_ROLE_ARN }} ProjectTag=${{ secrets.PROJECT }} OwnerTag=${{ secrets.OWNER }} EnvTag=${{ secrets.ENV }} SystemState=ACTIVE
            
          